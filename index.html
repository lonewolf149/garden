<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Quiet Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500&display=swap">
<style>
:root{
  /* Layout: a full-bleed canvas garden under an overcast sky. Quiet glass controls float at the top corners and the bottom edge. The note opens as a paper card over a dimmed scene. */
  --night:#10161b;
  --slate:#222c33;
  --mist:#c6d0d2;
  --moss:#7a9a63;
  --petal:#f0a3b6;
  --gold:#ecd07a;
  --paper:#f3eee2;
  --ink:#242c3c;
  --glass:rgba(22,29,35,.68);
  --line:rgba(214,226,228,.2);
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-ui:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--mist);font-family:var(--font-ui);overflow:hidden;overscroll-behavior:none}
#garden{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.ui{transition:opacity 1.2s ease .5s}
body.pre .ui{opacity:0;pointer-events:none}

.top{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.tag{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:1.25rem;line-height:1.1;color:var(--mist);opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.5);min-width:0;overflow-wrap:anywhere}
.cluster{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.82rem;letter-spacing:.04em}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover{border-color:rgba(236,208,122,.55)}
.btn[aria-pressed="false"]{color:rgba(198,208,210,.62)}

.tools{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:calc(100% - 32px);display:flex;gap:4px;padding:8px;border-radius:22px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:15px;border:1px solid transparent;background:transparent;font-size:.68rem;letter-spacing:.05em;color:rgba(198,208,210,.78)}
.tool canvas{width:36px;height:36px;display:block}
.tool[aria-pressed="true"]{background:rgba(240,163,182,.16);border-color:rgba(240,163,182,.7);color:#fff}

.hint{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);max-width:calc(100% - 32px);padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.8rem;letter-spacing:.03em;text-align:center;transition:opacity .8s ease;pointer-events:none}
.hint.off{opacity:0}

.intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 45%,rgba(16,22,27,.25),rgba(16,22,27,.8));transition:opacity 1.4s ease,visibility 0s linear 1.4s}
.intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.card{width:min(100%,30rem);padding:28px 26px 26px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.card h1{margin:0 0 12px;font-family:var(--font-display);font-style:italic;font-weight:600;font-size:clamp(2.3rem,9vw,3.5rem);line-height:.98;color:#f6f1e6;text-wrap:balance;overflow-wrap:anywhere}
.card p{margin:0 0 20px;font-size:1rem;line-height:1.55;color:var(--mist);max-width:36ch}
.card .small{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(198,208,210,.7);margin:16px 0 0}
.enter{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:999px;border:0;background:var(--petal);color:var(--ink);font-weight:500;font-size:1rem;letter-spacing:.03em}
.enter:hover{background:#f6b6c5}

.note-wrap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(8,12,16,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .4s ease}
.note-wrap.show{opacity:1}
.paper{position:relative;width:min(100%,30rem);max-height:calc(100% - 20px);overflow-y:auto;padding:30px 26px 22px;background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(70,92,130,.16) 31px 32px);background-attachment:local;color:var(--ink);border-radius:3px;box-shadow:0 24px 70px rgba(0,0,0,.55);transform:rotate(-1deg) translateY(14px);transition:transform .5s ease;font-family:var(--font-hand);font-weight:500;font-size:clamp(1.3rem,5vw,1.6rem);line-height:32px}
.note-wrap.show .paper{transform:rotate(-1deg) translateY(0)}
.paper::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(240,163,182,.6)}
.paper .text{white-space:pre-wrap;overflow-wrap:anywhere;min-height:200px;padding-right:46px}
.paper .text.typing::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-2px;background:var(--ink);animation:blink 1s steps(1) infinite}
.paper .sign{font-weight:600}
.paper canvas{position:absolute;top:14px;right:10px;width:48px;height:48px}
.close{margin-top:14px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(36,44,60,.35);background:transparent;color:var(--ink);font-family:var(--font-ui);font-size:.85rem;letter-spacing:.04em}
.close:hover{background:rgba(36,44,60,.08)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.paper .text.typing::after{animation:none}.note-wrap,.paper,.intro,.ui,.hint{transition-duration:.01s}}
@media (max-width:420px){.tag{font-size:1.05rem}.btn .lbl{display:none}}
html,body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>


<canvas id="garden" role="img" aria-label="A quiet flower garden under a cloudy sky, with birds, butterflies and a note left for you"></canvas>

<div class="top ui">
  <div class="tag" id="tag"></div>
  <div class="cluster">
    <button class="btn" id="bWeather" type="button"></button>
    <button class="btn" id="bRotate" type="button" aria-pressed="false" aria-label="Toggle garden view rotation"><span class="lbl">Rotate view</span></button>
    <button class="btn" id="bSound" type="button" aria-pressed="true" aria-label="Music"></button>
    <button class="btn" id="bNote" type="button" aria-label="Read the note"></button>
    <button class="btn" id="bUndo" type="button" aria-label="Remove the last thing you planted"></button>
  </div>
</div>

<div class="hint ui" id="hint">Tap to plant • drag to sow a row • enable Rotate view to look around</div>
<nav class="tools ui" id="tools" aria-label="Choose what to plant"></nav>

<section class="intro" id="intro">
  <div class="card">
    <h1 id="introTitle"></h1>
    <p id="introLine"></p>
    <button class="enter" id="enter" type="button">Enter the garden</button>
    <p class="small">Sound on for the full feeling</p>
  </div>
</section>

<div class="note-wrap" id="noteWrap" hidden role="dialog" aria-modal="true" aria-labelledby="noteText">
  <div class="paper" id="paper">
    <canvas id="pressed" width="96" height="96" aria-hidden="true"></canvas>
    <div class="text" id="noteText"></div>
    <button class="close" id="noteClose" type="button">Back to the garden</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- Edit these to make the garden yours ---------- */
const CONFIG = {
  to: 'you',
  from: 'Someone who thinks about you',
  intro: 'Someone planted this garden just for you. Take your time.',
  message: [
    'I wanted you to have a quiet place to stand when the day feels grey.',
    'Nothing here asks anything of you. The flowers keep growing, the birds keep passing through, and the sky is allowed to stay cloudy.',
    'Plant something of your own. Every flower you add is a small way of saying you matter to me more than I know how to say.'
  ],
  signoff: 'Always yours,'
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const cv = $('garden');
const ctx = cv.getContext('2d');
const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hsl = (h, s, l, a) => 'hsla(' + (h | 0) + ',' + (clamp(s, 0, 100) | 0) + '%,' + (clamp(l, 0, 100) | 0) + '%,' + (a === undefined ? 1 : a) + ')';
const qp = (t, a, b, c) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
const TAU = Math.PI * 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const tnow = () => performance.now() / 1000;

/* ---------- state ---------- */
let W = 800, H = 600, DPR = 1, K = 1, horizonY = 250, groundH = 350;
let now = 0, rain = 0, fog = 0, rainT = 0, fogT = 0, gust = 0.4;
let started = false, noteOpen = false, noteSeen = false, autoNoteT = 0;
let rotateView = false, viewX = 0, viewY = 0, rotateStartX = 0, rotateStartY = 0, viewStartX = 0, viewStartY = 0;
let tool = 'rose';
let skyC = null, landC = null, gradeC = null;
const clouds = [], cloudImgs = [];
const ents = [];
const petals = [], birds = [], flies = [], ripples = [];
const FLOWERS = new Set(['rose', 'tulip', 'sun', 'daisy', 'lav']);
const persp = ny => 0.26 + 0.94 * Math.pow(clamp(ny, 0, 1.05), 1.25);
const pathX = ny => 0.40 + 0.08 * Math.sin(ny * 4.6 + 0.6);
const STAKE = { nx: 0.62, ny: 0.72 };
function windAt(x) {
  return 0.55 * Math.sin(now * 0.8 + x * 0.0035) + 0.3 * Math.sin(now * 1.9 + x * 0.009 + 1.3) + gust * Math.sin(now * 3.1 + x * 0.01);
}

/* ---------- palettes ---------- */
const ROSE = [[352, 72, 40], [340, 68, 64], [10, 78, 60], [24, 40, 90], [46, 86, 58]];
const TULIP = [[354, 78, 50], [333, 72, 68], [46, 94, 58], [284, 46, 50], [22, 92, 56], [48, 30, 92]];
const DAISY = [[0, 0, 96], [340, 55, 90]];
const LAV = [[266, 52, 62], [278, 44, 70]];
const TREE = [[340, 72, 80], [334, 66, 64], [350, 52, 92], [266, 52, 72]];
const BF = [
  { c: [26, 92, 54], edge: 'rgba(28,18,10,.85)', dots: true },
  { c: [205, 70, 72], edge: 'rgba(25,40,70,.6)' },
  { c: [52, 92, 64], edge: 'rgba(60,45,10,.6)' },
  { c: [40, 12, 94], edge: 'rgba(60,60,70,.6)' },
  { c: [330, 65, 70], edge: 'rgba(70,20,40,.6)' }
];
const VAR = { rose: 5, tulip: 6, sun: 1, daisy: 2, lav: 2, tree: 4 };

/* ---------- sprites (flower heads and trees are painted once) ---------- */
const sprites = {};
function sprite(key, w, h, ax, ay, sc, fn) {
  if (sprites[key]) return sprites[key];
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * sc); c.height = Math.ceil(h * sc);
  const x = c.getContext('2d');
  x.scale(sc, sc); x.translate(ax, ay); fn(x);
  return (sprites[key] = { c, w, h, ax, ay });
}
function blit(s) { ctx.drawImage(s.c, -s.ax, -s.ay, s.w, s.h); }

function roseSprite(vi) {
  return sprite('rose' + vi, 44, 44, 22, 22, 3, x => {
    const r = mulberry32(100 + vi * 13);
    const P = ROSE[(vi >> 1) % ROSE.length], h = P[0], s = P[1], l = P[2];
    x.fillStyle = 'rgba(20,30,20,.2)'; x.beginPath(); x.ellipse(1.5, 2.5, 15, 14, 0, 0, TAU); x.fill();
    const rings = [{ n: 6, d: 9, r: 8.2, dl: 10 }, { n: 5, d: 6.3, r: 7, dl: 4 }, { n: 5, d: 3.9, r: 5.4, dl: -2 }, { n: 4, d: 2, r: 3.8, dl: -8 }, { n: 3, d: .7, r: 2.6, dl: -13 }];
    rings.forEach(g => {
      const off = r() * TAU;
      for (let i = 0; i < g.n; i++) {
        const a = off + i * (TAU / g.n) + (r() - .5) * .3;
        const px = Math.cos(a) * g.d, py = Math.sin(a) * g.d;
        const rx = g.r * (.95 + r() * .2), ry = g.r * (.72 + r() * .2);
        const gr = x.createRadialGradient(px - Math.cos(a) * g.r * .3, py - Math.sin(a) * g.r * .3, .5, px, py, g.r);
        gr.addColorStop(0, hsl(h, s, l + g.dl + 9));
        gr.addColorStop(1, hsl(h, s + 5, l + g.dl - 4));
        x.fillStyle = gr;
        x.beginPath(); x.ellipse(px, py, rx, ry, a + Math.PI / 2, 0, TAU); x.fill();
        x.strokeStyle = hsl(h, s, l + g.dl - 18, .45); x.lineWidth = .45; x.stroke();
      }
    });
    x.strokeStyle = hsl(h, s, l - 24, .7); x.lineWidth = .55; x.beginPath();
    for (let t = 0; t < 12; t += .3) { const rr = t * .22; x.lineTo(Math.cos(t * 1.5) * rr, Math.sin(t * 1.5) * rr); }
    x.stroke();
  });
}

function tulipSprite(vi) {
  return sprite('tulip' + vi, 44, 38, 22, 36, 3, x => {
    const P = TULIP[(vi >> 1) % TULIP.length], h = P[0], s = P[1], l = P[2];
    const w = 11.5, hh = 27;
    function petal(rot, dl, dxp) {
      x.save(); x.translate(dxp, 0); x.rotate(rot);
      const g = x.createLinearGradient(0, 0, 0, -hh);
      g.addColorStop(0, hsl(h, s, l + dl - 14)); g.addColorStop(.55, hsl(h, s, l + dl)); g.addColorStop(1, hsl(h, s - 4, l + dl + 10));
      x.fillStyle = g;
      x.beginPath(); x.moveTo(0, 0);
      x.bezierCurveTo(-w * 1.15, -hh * .06, -w * 1.02, -hh * .78, 0, -hh);
      x.bezierCurveTo(w * 1.02, -hh * .78, w * 1.15, -hh * .06, 0, 0);
      x.closePath(); x.fill();
      x.strokeStyle = hsl(h, s, l + dl - 22, .45); x.lineWidth = .5; x.stroke();
      x.restore();
    }
    petal(-.34, -14, -3.2);
    petal(.34, -10, 3.2);
    petal(0, 0, 0);
    x.strokeStyle = hsl(h, s, l - 18, .4); x.lineWidth = .6;
    x.beginPath(); x.moveTo(0, -1); x.quadraticCurveTo(-1, -hh * .5, 0, -hh * .92); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.16)'; x.beginPath(); x.ellipse(-w * .45, -hh * .5, 2.2, hh * .28, .15, 0, TAU); x.fill();
  });
}

function sunSprite(vi) {
  return sprite('sun' + vi, 72, 72, 36, 36, 2.6, x => {
    const r = mulberry32(55 + vi * 7);
    const R = 31, rc = 14.5, n = 24;
    [[.5, 40, 94, 42], [0, 47, 100, 54]].forEach((L, li) => {
      for (let i = 0; i < n; i++) {
        const a = (i + L[0]) * TAU / n + (r() - .5) * .08;
        const len = R * (.93 + r() * .09), pw = 5 + r() * 1.2;
        x.save(); x.rotate(a);
        const g = x.createLinearGradient(rc, 0, len, 0);
        g.addColorStop(0, hsl(L[1] - 6, L[2], L[3] - 10)); g.addColorStop(1, hsl(L[1], L[2], L[3] + 6));
        x.fillStyle = g;
        x.beginPath(); x.moveTo(rc * .8, 0);
        x.bezierCurveTo(rc + (len - rc) * .3, -pw, rc + (len - rc) * .75, -pw * .9, len, 0);
        x.bezierCurveTo(rc + (len - rc) * .75, pw * .9, rc + (len - rc) * .3, pw, rc * .8, 0);
        x.fill();
        if (li) { x.strokeStyle = 'rgba(120,70,0,.22)'; x.lineWidth = .4; x.beginPath(); x.moveTo(rc, 0); x.lineTo(len * .9, 0); x.stroke(); }
        x.restore();
      }
    });
    const dg = x.createRadialGradient(0, 0, 0, 0, 0, rc);
    dg.addColorStop(0, hsl(25, 55, 12)); dg.addColorStop(.7, hsl(28, 50, 20)); dg.addColorStop(1, hsl(32, 55, 30));
    x.fillStyle = dg; x.beginPath(); x.arc(0, 0, rc, 0, TAU); x.fill();
    x.strokeStyle = hsl(40, 62, 38); x.lineWidth = 1.3; x.beginPath(); x.arc(0, 0, rc - .6, 0, TAU); x.stroke();
    for (let i = 0; i < 95; i++) {
      const rr = rc * .93 * Math.sqrt((i + .5) / 95), a = i * 2.39996;
      x.fillStyle = hsl(36, 45, 36 + (rr / rc) * 10, .6);
      x.beginPath(); x.arc(Math.cos(a) * rr, Math.sin(a) * rr, .5 + rr / rc * .5, 0, TAU); x.fill();
    }
  });
}

function daisySprite(vi) {
  return sprite('daisy' + vi, 28, 28, 14, 14, 3.2, x => {
    const P = DAISY[vi % DAISY.length], n = 17;
    for (let i = 0; i < n; i++) {
      x.save(); x.rotate(i * TAU / n);
      const g = x.createLinearGradient(2, 0, 11, 0);
      g.addColorStop(0, hsl(P[0], P[1], P[2] - 14)); g.addColorStop(1, hsl(P[0], P[1], P[2]));
      x.fillStyle = g; x.beginPath(); x.ellipse(7, 0, 5.2, 1.5, 0, 0, TAU); x.fill();
      x.restore();
    }
    x.fillStyle = hsl(46, 95, 56); x.beginPath(); x.arc(0, 0, 3.4, 0, TAU); x.fill();
    x.fillStyle = hsl(38, 80, 38); x.beginPath(); x.arc(.6, .6, 1.4, 0, TAU); x.fill();
  });
}

function lavSprite(vi) {
  return sprite('lav' + vi, 16, 62, 8, 60, 3, x => {
    const r = mulberry32(300 + vi), P = LAV[vi % LAV.length], N = 36;
    for (let i = 0; i < N; i++) {
      const t = i / N, yy = -2 - t * 50, wid = (1 - t * .55) * 3.2;
      for (let sd = -1; sd <= 1; sd += 2) {
        const xx = sd * (.8 + wid * (.5 + r() * .5));
        x.fillStyle = hsl(P[0] + (r() - .5) * 14, P[1], P[2] + (r() - .5) * 18);
        x.beginPath(); x.ellipse(xx, yy + (r() - .5) * 2, 2.1 * (1 - t * .35), 1.7, sd * .5, 0, TAU); x.fill();
      }
    }
    x.fillStyle = hsl(P[0], P[1], P[2] - 8); x.beginPath(); x.ellipse(0, -53, 1.5, 2.4, 0, 0, TAU); x.fill();
  });
}

function treeSprite(vi) {
  return sprite('tree' + vi, 460, 520, 230, 512, 1.35, x => {
    const r = mulberry32(900 + vi * 31), P = TREE[vi % TREE.length];
    const tips = [];
    function br(px, py, ang, len, wd, d) {
      const nx = px + Math.cos(ang) * len, ny = py + Math.sin(ang) * len;
      x.strokeStyle = hsl(22, 16, d < 2 ? 17 : 23); x.lineWidth = wd; x.lineCap = 'round';
      x.beginPath(); x.moveTo(px, py);
      x.quadraticCurveTo((px + nx) / 2 + (r() - .5) * len * .25, (py + ny) / 2 + (r() - .5) * len * .25, nx, ny); x.stroke();
      if (d >= 5) { tips.push([nx, ny]); return; }
      const n = d < 1 ? 2 : (r() < .35 ? 3 : 2);
      for (let i = 0; i < n; i++) {
        const sp = (i - (n - 1) / 2) * .62 + (r() - .5) * .35;
        br(nx, ny, ang + sp, len * (.72 + r() * .1), wd * .68, d + 1);
      }
      if (d >= 2 && r() < .5) tips.push([nx, ny]);
    }
    br(230, 512, -Math.PI / 2 + (r() - .5) * .1, 120, 17, 0);
    tips.forEach(t => {
      const g = x.createRadialGradient(t[0], t[1], 0, t[0], t[1], 46);
      g.addColorStop(0, hsl(P[0], P[1] - 8, P[2] - 20, .3)); g.addColorStop(1, hsl(P[0], P[1] - 8, P[2] - 20, 0));

}

/* ---------- planting ---------- */
const SAVE_KEY = 'quiet-garden-v1';
function saveGarden() {
  try {
    const a = ents.filter(e => e.user).map(e => [e.kind, +e.nx.toFixed(4), +e.ny.toFixed(4), e.v, e.sv]);
    localStorage.setItem(SAVE_KEY, JSON.stringify(a.slice(-300)));
  } catch (err) { /* storage can be unavailable */ }
}
function loadGarden() {
  try {
    const a = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]');
    if (!Array.isArray(a)) return;
    for (const it of a.slice(-300)) {
      if (!Array.isArray(it) || !VAR[it[0]]) continue;
      const e = mkFlower(it[0], clamp(+it[1] || 0, 0, 1), clamp(+it[2] || .5, .05, 1.02), { user: true, v: (it[3] | 0) % VAR[it[0]] });
      e.sv = it[4] ? 1 : 0; ents.push(e);
    }
  } catch (err) { /* ignore */ }
}
let hintOff = false;
function hideHint() { if (hintOff) return; hintOff = true; $('hint').classList.add('off'); }
let lastPlant = null;
function plantAt(px, py, jitter) {
  const ny = (py - horizonY) / groundH;
  if (ny < .05) return false;
  const jx = jitter ? (Math.random() - .5) * 10 : 0, jy = jitter ? (Math.random() - .5) * 8 : 0;
  const e = mkFlower(tool, clamp((px + jx) / W, .01, .99), clamp((py + jy - horizonY) / groundH, .05, 1.02), { user: true });
  e.plantT = tnow();
  ents.push(e);
  const mine = ents.filter(q => q.user);
  if (mine.length > 300) ents.splice(ents.indexOf(mine[0]), 1);
  sortEnts(); saveGarden(); hideHint(); Sound.pluck();
  return true;
}
function hitStake(px, py) {
  for (const e of ents) if (e.kind === 'stake') return Math.hypot(px - e.hx, py - e.hy) < Math.max(34, 44 * e.S);
  return false;
}
let dragging = false, rotating = false;
cv.addEventListener('pointerdown', ev => {
  if (!started || noteOpen) return;
  if (hitStake(ev.clientX, ev.clientY) && !rotateView) { openNote(); return; }
  dragging = true; lastPlant = null;
  rotating = rotateView || ev.button === 2;
  rotateStartX = ev.clientX; rotateStartY = ev.clientY; viewStartX = viewX; viewStartY = viewY;
  try { cv.setPointerCapture(ev.pointerId); } catch (err) { /* ignore */ }
  if (!rotating && plantAt(ev.clientX, ev.clientY, false)) lastPlant = [ev.clientX, ev.clientY];
});
cv.addEventListener('contextmenu', ev => ev.preventDefault());
cv.addEventListener('pointermove', ev => {
  if (!started) return;
  if (!dragging) { cv.style.cursor = rotateView ? 'grab' : (hitStake(ev.clientX, ev.clientY) ? 'pointer' : ''); return; }
  if (rotating) {
    viewX = clamp(viewStartX + ev.clientX - rotateStartX, -180, 180);
    viewY = clamp(viewStartY + ev.clientY - rotateStartY, -100, 100);
    cv.style.cursor = 'grabbing'; return;
  }
  if (tool === 'tree') return;
  const ny = clamp((ev.clientY - horizonY) / groundH, 0, 1), min = 30 * K * persp(ny);
  if (!lastPlant || Math.hypot(ev.clientX - lastPlant[0], ev.clientY - lastPlant[1]) >= min) {
    if (plantAt(ev.clientX, ev.clientY, true)) lastPlant = [ev.clientX, ev.clientY];
  }
});
const endDrag = () => { dragging = false; rotating = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

/* ---------- interface ---------- */
const ICON = {
  on: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  off: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5M21 9.5l-4 5"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 9.5a4.2 4.2 0 0 1 .5 8.5H7z"/></svg>',
  rain: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 5.5a4.2 4.2 0 0 1 .5 8.5H7z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
  fog: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M6 12h12M4 16h14M8 20h9"/></svg>',
  note: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg>',
  undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L4 11l5 5"/><path d="M4.5 11H14a5 5 0 0 1 0 10h-3"/></svg>'
};
const MODES = [
  { name: 'Overcast', rain: 0, fog: 0, icon: 'cloud' },
  { name: 'Drizzle', rain: 1, fog: .15, icon: 'rain' },
  { name: 'Fog', rain: 0, fog: 1, icon: 'fog' }
];
let mode = 0;
function setMode(m) {
  mode = m; rainT = MODES[m].rain; fogT = MODES[m].fog;
  $('bWeather').innerHTML = ICON[MODES[m].icon] + '<span class="lbl">' + MODES[m].name + '</span>';
  $('bWeather').setAttribute('aria-label', 'Weather: ' + MODES[m].name + '. Change weather');
}
function setSoundBtn() {
  $('bSound').innerHTML = Sound.on ? ICON.on : ICON.off;
  $('bSound').setAttribute('aria-pressed', String(Sound.on));
  $('bSound').setAttribute('aria-label', Sound.on ? 'Mute the music' : 'Play the music');
}
$('bWeather').addEventListener('click', () => setMode((mode + 1) % MODES.length));
$('bRotate').addEventListener('click', () => {
  rotateView = !rotateView;
  $('bRotate').setAttribute('aria-pressed', String(rotateView));
  $('bRotate').innerHTML = '<span class="lbl">' + (rotateView ? 'Rotate: on' : 'Rotate view') + '</span>';
  if (!rotateView) { viewX *= .25; viewY *= .25; }
  cv.style.cursor = rotateView ? 'grab' : '';
  hideHint();
});
$('bSound').addEventListener('click', () => {
  if (!Sound.ready) Sound.start(); else Sound.setOn(!Sound.on);
  setSoundBtn();
});
$('bNote').innerHTML = ICON.note;
$('bUndo').innerHTML = ICON.undo;
$('bNote').addEventListener('click', openNote);
$('bUndo').addEventListener('click', () => {
  for (let i = ents.length - 1; i >= 0; i--) if (ents[i].user) { ents.splice(i, 1); break; }
  saveGarden();
});

const TOOLS = [
  { id: 'rose', label: 'Rose', v: 0, sv: 0 }, { id: 'tulip', label: 'Tulip', v: 1, sv: 0 }, { id: 'sun', label: 'Sunflower', v: 0, sv: 0 },
  { id: 'daisy', label: 'Daisy', v: 0, sv: 0 }, { id: 'lav', label: 'Lavender', v: 0, sv: 0 }, { id: 'tree', label: 'Blossom', v: 0, sv: 0 }
];
function buildTools() {
  const nav = $('tools');
  TOOLS.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tool'; b.setAttribute('aria-pressed', String(t.id === tool)); b.dataset.id = t.id;
    const c = document.createElement('canvas'); c.width = 72; c.height = 72;
    const x = c.getContext('2d'), s = spriteFor(t.id, t.v, t.sv), sc = Math.min(68 / s.w, 68 / s.h);
    x.drawImage(s.c, (72 - s.w * sc) / 2, (72 - s.h * sc) / 2, s.w * sc, s.h * sc);
    const lb = document.createElement('span'); lb.textContent = t.label;
    b.appendChild(c); b.appendChild(lb);
    b.addEventListener('click', () => {
      tool = t.id;
      nav.querySelectorAll('.tool').forEach(o => o.setAttribute('aria-pressed', String(o.dataset.id === tool)));
    });
    nav.appendChild(b);
  });
}

/* ---------- the note ---------- */
let typeTimer = 0, fullText = '', typed = 0;
function noteString() {
  return 'Dear ' + CONFIG.to + ',\n\n' + CONFIG.message.join('\n\n') + '\n\n' + CONFIG.signoff + '\n' + CONFIG.from;
}
function renderNote(n) {
  const el = $('noteText');
  el.textContent = fullText.slice(0, n);
  el.classList.toggle('typing', n < fullText.length);
}
function openNote() {
  if (noteOpen) return;
  noteOpen = true; noteSeen = true; clearTimeout(autoNoteT);
  const wrap = $('noteWrap');
  wrap.hidden = false;
  const pc = $('pressed'), px = pc.getContext('2d');
  px.clearRect(0, 0, 96, 96);
  const rs = roseSprite(2); px.save(); px.translate(34, 52); px.rotate(-.4); px.drawImage(rs.c, 0, 0, rs.c.width, rs.c.height, -26, -26, 52, 52); px.restore();
  const ds = daisySprite(1); px.save(); px.translate(66, 30); px.rotate(.5); px.drawImage(ds.c, 0, 0, ds.c.width, ds.c.height, -17, -17, 34, 34); px.restore();
  fullText = noteString(); typed = 0; renderNote(0);
  requestAnimationFrame(() => wrap.classList.add('show'));
  clearInterval(typeTimer);
  if (REDUCE) { typed = fullText.length; renderNote(typed); }
  else typeTimer = setInterval(() => { typed = Math.min(fullText.length, typed + 1); renderNote(typed); if (typed >= fullText.length) clearInterval(typeTimer); }, 34);
  $('noteClose').focus();
}
function closeNote() {
  if (!noteOpen) return;
  noteOpen = false; clearInterval(typeTimer);
  const wrap = $('noteWrap'); wrap.classList.remove('show');
  setTimeout(() => { if (!noteOpen) wrap.hidden = true; }, 400);
  $('bNote').focus();
}
$('paper').addEventListener('click', ev => { if (ev.target.id !== 'noteClose' && typed < fullText.length) { clearInterval(typeTimer); typed = fullText.length; renderNote(typed); } });
$('noteClose').addEventListener('click', closeNote);
$('noteWrap').addEventListener('click', ev => { if (ev.target.id === 'noteWrap') closeNote(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeNote(); });
document.addEventListener('visibilitychange', () => {
  if (!Sound.ready) return;
  if (document.hidden) Sound.ctx.suspend(); else if (Sound.on) Sound.ctx.resume();
});

/* ---------- start ---------- */
function enterGarden() {
  if (started) return;
  started = true;
  Sound.start(); setSoundBtn();
  document.body.classList.remove('pre');
  $('intro').classList.add('gone');
  const t0 = tnow() + .5;
  for (const e of ents) {
    if (e.kind === 'grass' || e.kind === 'stake') continue;
    e.plantT = t0 + (REDUCE ? 0 : (1 - e.ny) * 1.2 + Math.random() * 2.4);
  }
  autoNoteT = setTimeout(openNote, 16000);
  setTimeout(hideHint, 14000);
}
$('enter').addEventListener('click', enterGarden);

document.body.classList.add('pre');
$('tag').textContent = 'A garden for ' + CONFIG.to;
$('introTitle').textContent = 'A garden for ' + CONFIG.to;
$('introLine').textContent = CONFIG.intro;
sizeCanvas(); buildStatic();
seedGrass(); seedGarden(); loadGarden(); sortEnts();
const nFlies = W < 600 ? 4 : 6;
for (let i = 0; i < nFlies; i++) flies.push(newButterfly(i));
buildTools(); setMode(0); setSoundBtn();
requestAnimationFrame(frame);
})();
</script>
